<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cutouts Preview</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0d0d1a;
      color: #f2f2f2;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 20px;
      color: #c9a84c;
      letter-spacing: 0.04em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }
    .card {
      border: 1px solid rgba(201, 168, 76, 0.35);
      border-radius: 8px;
      background: #111325;
      padding: 12px;
    }
    .img-wrap {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a16;
      border-radius: 6px;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .name {
      margin-top: 10px;
      font-size: 12px;
      color: #bfc2d3;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>Edited Product Cutouts</h1>
  <div class="grid">
    <div class="card">
      <div class="img-wrap"><img src="/images/products/cutouts/page13_04_web_cutout.png" alt="page13_04_web_cutout" /></div>
      <div class="name">page13_04_web_cutout.png</div>
    </div>
    <div class="card">
      <div class="img-wrap"><img src="/images/products/cutouts/page13_07_web_cutout.png" alt="page13_07_web_cutout" /></div>
      <div class="name">page13_07_web_cutout.png</div>
    </div>
    <div class="card">
      <div class="img-wrap"><img src="/images/products/cutouts/page14_01_web_cutout.png" alt="page14_01_web_cutout" /></div>
      <div class="name">page14_01_web_cutout.png</div>
    </div>
    <div class="card">
      <div class="img-wrap"><img src="/images/products/cutouts/page17_01_web_cutout.png" alt="page17_01_web_cutout" /></div>
      <div class="name">page17_01_web_cutout.png</div>
    </div>
    <div class="card">
      <div class="img-wrap"><img src="/images/products/cutouts/page17_02_web_cutout.png" alt="page17_02_web_cutout" /></div>
      <div class="name">page17_02_web_cutout.png</div>
    </div>
  </div>
</body>
</html>
